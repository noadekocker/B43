<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B43 – Lekker tuinen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B43">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF9EF">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Stijlgids B43: alleen room, woudgroen, olijf, lucht, roest, klaproos (+ wit voor kaarten). Eén lettertype: Inter. */
:root{
  --room:#FFF9EF; --woud:#212C02; --olijf:#838E2C; --lucht:#7BADC9; --roest:#592A24; --klaproos:#ED412F; --wit:#FFFFFF;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--room);color:var(--woud);font-family:var(--font);font-size:16px;line-height:1.45;letter-spacing:-.005em;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lucht);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 18px 4px}
.brand{color:var(--woud);display:block;line-height:0}
.brand .logo{width:100px;height:auto}
header.top h1{margin:0;font-size:1.6rem;font-weight:700}
header.top h1:empty{display:none}
.note{margin:6px 18px 0;padding:10px 14px;border-radius:10px;background:var(--wit);font-size:.9rem}
.note:empty{display:none}
main{flex:1;padding:12px 18px 24px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .count{font-size:.75rem;background:var(--woud);color:var(--room);border-radius:10px;padding:1px 8px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seeall{color:var(--woud);font-size:.95rem;text-decoration:underline;text-underline-offset:3px}
.small{font-size:.85rem}
.list{background:var(--wit);border-radius:10px}
.empty{padding:16px;font-size:.95rem}

/* maandstrip */
.mstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mday{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.mday .mname{font-size:.9rem}
.mday .mnum{width:44px;height:44px;border-radius:50%;background:var(--wit);display:grid;place-items:center;font-size:1.05rem}
.mday.on .mname{font-weight:700}
.mday.on .mnum{background:var(--woud);color:var(--room)}

/* kaart bovenaan */
.hero{background:var(--klaproos);color:var(--room);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hero h3{margin:0;font-size:1.2rem;font-weight:600}
.hero p{margin:0 0 6px;font-size:1rem;line-height:1.35}

/* taakkaarten */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:1fr 56px;background:var(--wit);border-radius:10px;overflow:hidden}
.tcard{border:0;background:none;padding:12px 4px 12px 12px;display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;text-align:left;min-width:0}
.ticon{width:42px;height:42px;border-radius:8px;background:var(--z);display:grid;place-items:center;flex:none}
.ticon svg{width:22px;height:22px;fill:none;stroke:var(--zi);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ticon.big{width:48px;height:48px}
.tmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.tmain .title{font-size:.98rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.tmain .sub{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.late .sub .d{color:var(--klaproos);font-weight:700}
.trow.done .title{text-decoration:line-through}
.done-btn{border:0;background:none;display:grid;place-items:center;padding:0}
.done-btn span{width:34px;height:34px;border-radius:50%;border:2px solid var(--woud);display:grid;place-items:center}
.done-btn svg{width:18px;height:18px;fill:none;stroke:var(--woud);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.trow.busy .done-btn span{border-color:var(--lucht)}
.trow.done .done-btn span{background:var(--olijf);border-color:var(--olijf)}
.trow.done .done-btn svg{opacity:1}

/* wie doet wat + voortgang */
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptile{border:0;border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-height:118px;justify-content:center;color:var(--woud)}
.ptile.me{background:var(--lucht)} .ptile.other{background:var(--olijf)}
.plabel{font-size:1rem} .pbig{font-size:2.4rem;line-height:1.05} .psub{font-size:.85rem;text-wrap:balance}
.prog{background:var(--wit);border-radius:12px;padding:20px 14px 18px;gap:6px}
.pnum{display:flex;justify-content:center;align-items:baseline;gap:6px}
.pnum .big{font-size:3.2rem;line-height:1} .pnum .of{font-size:1.4rem}
.prog p{margin:0;text-align:center}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;justify-content:safe center}
.pills::-webkit-scrollbar{display:none}
.pillbar{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:58px}
.track{position:relative;width:52px;height:140px;border-radius:10px;background:var(--room);overflow:hidden;display:block}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--z);border-radius:10px}
.pct{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:.75rem;font-weight:700}
.pname{font-size:.8rem} .pcount{font-size:.72rem}

/* filters, zoeken */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{border:0;background:var(--wit);border-radius:10px;padding:8px 14px;font-size:.92rem;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--woud);color:var(--room)}
select.pill{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--woud) 50%),linear-gradient(135deg,var(--woud) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.search{display:flex;align-items:center;gap:8px;background:var(--wit);border-radius:10px;padding:10px 16px}
.search svg{width:20px;height:20px;fill:none;stroke:var(--woud);stroke-width:1.8;stroke-linecap:round}
.search input{border:0;background:none;flex:1;font-size:1rem;min-width:0;outline:none}
.zonelist{display:flex;flex-wrap:wrap;gap:8px}

/* planten */
.prow{list-style:none}
.prow .tcard{width:100%;background:var(--wit);border-radius:10px;grid-template-columns:42px 1fr auto;padding:12px}
.pst{font-size:.78rem;border-radius:10px;padding:3px 10px;white-space:nowrap}
.pst.staat{background:var(--olijf)} .pst.gepland{background:var(--lucht)} .pst.weg{background:var(--room)}
.entryform{display:flex;flex-direction:column;gap:8px;background:var(--room);border-radius:10px;padding:10px}
.entryform input,.entryform textarea{border:1px solid var(--woud);background:var(--wit);border-radius:8px;padding:9px 12px;font-size:1rem;width:100%}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.entries li{display:flex;flex-direction:column;gap:2px;white-space:pre-wrap;background:var(--room);border-radius:8px;padding:10px 12px}
.edate{font-size:.8rem;font-weight:700}

/* plattegrond */
.mapwrap{background:var(--wit);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.mapwrap svg{width:100%;height:auto;max-height:70vh;display:block;margin:0 auto}
svg .zone{cursor:pointer}
svg .zone.sel{stroke:var(--klaproos);stroke-width:4}
svg .lbl{font-family:var(--font);font-size:13px;font-weight:700;pointer-events:none}
svg .lbl.s{font-size:11px;font-weight:400}
svg .badge circle{fill:var(--klaproos)} svg .badge text{fill:var(--room);font-size:12px;font-weight:700;font-family:var(--font);text-anchor:middle;pointer-events:none}
.compass{font-size:.82rem;display:flex;justify-content:space-between}

/* menu */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--wit);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;color:var(--woud);text-decoration:none;font-size:.78rem}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{font-weight:700}
nav.tabs a[aria-current="page"] svg{stroke-width:2.4}
nav.tabs .plus{justify-self:center;align-self:center;width:60px;height:60px;margin-top:-22px;border-radius:50%;border:0;background:var(--klaproos);color:var(--room);display:grid;place-items:center}
nav.tabs .plus svg{width:30px;height:30px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
nav.tabs .plus[hidden]{visibility:hidden;display:grid}

/* sheet en formulieren */
.scrim{position:fixed;inset:0;background:rgba(33,44,2,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--wit);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:1.35rem;margin:0;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.bar-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--room);border-radius:50%;width:36px;height:36px;flex:none;font-size:1.2rem;line-height:1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:700}
label.f span.h{font-weight:400;font-size:.8rem}
.f input,.f select,.f textarea{border:1px solid var(--woud);background:var(--wit);border-radius:8px;padding:10px 12px;font-weight:400;font-size:1rem;width:100%;min-width:0}
.f textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;background:var(--room);border-radius:10px;padding:11px 18px;font-weight:700}
.btn.primary,.btn.dark{background:var(--woud);color:var(--room)}
.btn.danger{background:var(--room);color:var(--klaproos)}
.btn.grow{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border-radius:10px;overflow:hidden;background:var(--room)}
.seg button{border:0;background:none;padding:10px 4px;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--woud);color:var(--room)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;margin:0}
.dl dt{font-weight:700} .dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.mats{margin:0;padding-left:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));background:var(--woud);color:var(--room);border-radius:10px;padding:10px 16px;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);font-size:.92rem}
.toast[hidden]{display:none}
.toast button{border:0;background:none;color:var(--room);font-weight:700;text-decoration:underline;padding:0}
details.more{background:var(--room);border-radius:10px;padding:0}
details.more summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:.92rem;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"– "}
.morebody{display:flex;flex-direction:column;gap:14px;padding:0 14px 14px}
.mstrip{grid-template-columns:repeat(auto-fit,minmax(44px,1fr))}
svg.hand{fill:currentColor;stroke:none;display:block}
.ticon{color:var(--zi)}
.ticon svg.hand{width:30px;height:30px;fill:var(--zi);stroke:none}
.ticon.big svg.hand{width:34px;height:34px}
.ticon svg.line{width:22px;height:22px;fill:none;stroke:var(--zi);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .ni svg.hand{width:26px;height:26px;fill:currentColor;stroke:none}
nav.tabs .plus .ni svg.hand{fill:var(--room)}
nav.tabs .plus .ni svg.hand{width:28px;height:28px}
.done-btn svg.hand{width:20px;height:20px;fill:var(--woud);opacity:0}
.trow.done .done-btn svg.hand{opacity:1}
.search svg.hand{width:20px;height:20px;fill:var(--woud)}
.x{display:grid;place-items:center}
.x svg.hand{width:16px;height:16px}
.hero .btn.dark{background:var(--room);color:var(--klaproos)}
/* vaste schermindeling (iPhone): alleen het midden scrolt, menu blijft onderaan */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--room)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.app{min-height:auto;padding-bottom:28px}
nav.tabs{position:relative;left:auto;right:auto;bottom:auto;flex:none}
.login{background:var(--wit);border-radius:12px;padding:18px;gap:12px}
.loginform{display:flex;flex-direction:column;gap:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--woud);text-decoration:underline;font:inherit;font-size:inherit}
nav.tabs[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const todayISO = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const curMonth = ()=>todayISO().slice(0,7);
function addMonths(ym,n){let [y,m]=ym.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0");}
const mLabel = ym=>ym?MONTHS[+ym.slice(5,7)-1]:"";
function windowLabel(t){
  if(t.from&&t.to) return t.from===t.to?mLabel(t.from):mLabel(t.from)+" – "+mLabel(t.to);
  if(t.from) return "vanaf "+mLabel(t.from);
  if(t.to) return "tot "+mLabel(t.to);
  return "";
}
function dateLabel(iso){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return d.getDate()+" "+MONTHS[d.getMonth()]; }
function dateLong(iso){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("nl-BE",{weekday:"short",day:"numeric",month:"long",year:"numeric"}); }
function isLate(t){
  if(t.status==="klaar") return false;
  const today=todayISO(), cm=curMonth();
  return (t.deadline && t.deadline<today) || (t.to && t.to<cm);
}
function blockers(t){ return (t.blockedBy||[]).map(id=>S.tasks.find(x=>x.id===id)).filter(b=>b && b.status!=="klaar"); }
function sortKey(t){ return (t.deadline||"9999")+"|"+(t.to||"9999")+"|"+(t.from||"0000")+"|"+(t.title||""); }
const byWhen = (a,b)=>sortKey(a)<sortKey(b)?-1:1;
function who(id){
  if(!id) return "";
  if(id==="samen") return "Samen";
  if(id===S.me) return "Ik";
  return S.names[id] || (String(id).split("@")[0]) || "Partner";
}
async function resolveNames(){
  return;
  const ids=new Set();
  if(S.me) ids.add(S.me);
  S.tasks.forEach(t=>{[t.who,t.createdBy,t.doneBy].forEach(i=>i&&i!=="samen"&&ids.add(i))});
  const missing=[...ids].filter(i=>!(i in S.names));
  if(!missing.length) return;
  try{
    const ps=await user.profiles(missing);
    let changed=false;
    missing.forEach(i=>{const n=(ps&&ps[i]&&ps[i].name)||""; S.names[i]=n.split(" ")[0]||"Partner"; changed=true;});
    if(changed) render();
  }catch(e){}
}
function people(){
  const ids=new Set(S.members||[]);
  if(S.me) ids.add(S.me);
  S.tasks.forEach(t=>{[t.who,t.createdBy,t.doneBy].forEach(i=>i&&i!=="samen"&&ids.add(i))});
  return [...ids];
}
function setNote(msg){ $("#note").textContent=msg||""; }
let toastTimer;
function toast(html, actions){
  const el=$("#toast"); el.innerHTML="<span>"+html+"</span>"; el.hidden=false;
  (actions||[]).forEach(a=>{const b=document.createElement("button");b.type="button";b.textContent=a.label;b.onclick=()=>{el.hidden=true;a.run()};el.appendChild(b);});
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true, actions&&actions.length?7000:3000);
}
function writeFailed(e){
  if(e && (e.code==="42501" || e.code==="invalid_argument")){ S.readOnly=true; setNote("Je hebt geen toegang om iets aan te passen. Meld je aan met het juiste mailadres."); }
  else if(e && e.code==="quota_exceeded"){ toast("De opslag is vol. Verwijder oude taken."); }
  else toast("Opslaan lukte niet. Probeer het zo opnieuw.");
}

const hand=(k,cls="")=>{const i=HAND[k];return `<svg class="hand ${cls}" viewBox="${i.vb}" aria-hidden="true">${i.d.map(d=>`<path d="${d}"/>`).join("")}</svg>`;};
const ZONE_HAND={moestuin:"spruit",kippen:"ei",gazon:"boom",bomen:"bomen",bloemen:"bloem",haag:"druif",paden:"stenen",algemeen:"spade"};
const icon=(zid)=>ZONE_HAND[zid]?hand(ZONE_HAND[zid]):`<svg class="line" viewBox="0 0 24 24" aria-hidden="true">${ICONS[zid]||ICONS.algemeen}</svg>`;
const TIPS={
  "01":"Rustige maand: plannen maken, zaden bestellen en gereedschap nakijken.",
  "02":"Laatste kans om bomen te verplanten, vóór ze in maart uitlopen.",
  "03":"De grond warmt op. Bakken vullen en de eerste zaaisels binnen starten.",
  "04":"Alles komt los. Mulch leggen en jonge plantjes tegen slakken beschermen.",
  "05":"Na de ijsheiligen mogen tomaat en courgette naar buiten.",
  "06":"Lange dagen: water geven in de ochtend en de borders laten bloeien.",
  "07":"Oogsttijd. Regenwater spaart je kraan en je bodemleven.",
  "08":"Zaad oogsten van de mooiste bloemen voor volgend jaar.",
  "09":"Groenbemester zaaien op lege bedden, zodat de grond niet kaal ligt.",
  "10":"Bollen planten voor de lente: tulpen in de zon, krokussen onder de bomen.",
  "11":"De winterrust begint. Ideaal om te snoeien, te rooien en bomen te verplanten.",
  "12":"Laat het blad op de bedden liggen: een gratis deken voor het bodemleven."
};
function inMonth(t,m){
  if(t.status==="klaar") return false;
  if(t.deadline && t.deadline.slice(0,7)===m) return true;
  if(!t.from && !t.to) return false;
  return (!t.from||t.from<=m) && (!t.to||t.to>=m);
}

/* ---------- weergaven ---------- */
function taskRow(t){
  const late=isLate(t), bl=blockers(t);
  const st=t.status==="klaar"?"done":t.status==="bezig"?"busy":"";
  const z=Z[t.zone]||Z.algemeen;
  const when=t.deadline?"vóór "+dateLabel(t.deadline):windowLabel(t);
  const sub=[esc(SHORT[z.id]||z.name)];
  if(when) sub.push(`<span class="d">${esc(late?"te laat":when)}</span>`);
  if(t.who) sub.push(esc(who(t.who)));
  if(t.status==="bezig") sub.push("bezig");
  if(bl.length) sub.push("wacht");
  const label = t.status==="klaar" ? "Niet klaar" : "Klaar";
  return `<li class="trow ${st} ${late?"late":""}">
    <button class="tcard" type="button" data-act="edit" data-id="${esc(t.id)}" aria-label="Bewerk: ${esc(t.title)}">
      <span class="ticon" style="--z:${z.color};--zi:${z.ink}">${icon(z.id)}</span>
      <span class="tmain"><span class="title">${esc(t.title)}</span><span class="sub">${sub.join(" · ")}</span></span>
    </button>
    <button class="done-btn" type="button" data-act="toggle" data-id="${esc(t.id)}" aria-label="${label}: ${esc(t.title)}"><span>${hand("vink")}</span></button>
  </li>`;
}

function rows(tasks, emptyText){
  return tasks.length?`<ul class="tl">${tasks.map(taskRow).join("")}</ul>`:`<div class="list"><div class="empty">${emptyText}</div></div>`;
}
function listBlock(title, tasks, emptyText, more){
  return `<section><div class="shead"><h2>${title} <span class="count">${tasks.length}</span></h2>${more||""}</div>${rows(tasks,emptyText)}</section>`;
}
function loadingBlock(){ return `<div class="list"><div class="empty">Tuin laden…</div></div>`; }
function partnerId(){ return people().find(p=>p!==S.me)||null; }
function personStats(id){
  const mine=S.tasks.filter(t=>t.status!=="klaar" && (t.who===id || t.who==="samen"));
  return {open:mine.length, busy:mine.filter(t=>t.status==="bezig").length};
}
function personTile(id, cls, label){
  if(!id) return `<div class="ptile ${cls}"><span class="plabel">${label}</span><span class="pbig">–</span><span class="psub">Deel de app via Delen, dan verschijnt je partner hier.</span></div>`;
  const s=personStats(id);
  return `<button type="button" class="ptile ${cls}" data-act="who" data-who="${esc(id)}"><span class="plabel">${esc(label)}</span><span class="pbig">${s.open}</span><span class="psub">${s.open===1?"werk":"werken"} op naam${s.busy?` · ${s.busy} bezig`:""}</span></button>`;
}

function viewNu(){
  if(!S.loadedT) return loadingBlock();
  const cm=curMonth(), today=todayISO();
  const open=S.tasks.filter(t=>t.status!=="klaar");
  let h="";
  // één kaart: eerstvolgende harde datum, anders de tip van de maand
  const dl=open.filter(t=>t.deadline && t.deadline>=today).sort(byWhen);
  let card=null;
  if(dl.length){
    const d=dl[0].deadline, same=dl.filter(t=>t.deadline===d);
    const days=Math.round((new Date(d+"T12:00:00")-new Date(today+"T12:00:00"))/864e5);
    if(days<=120){
      const left=days>21?`Nog ${Math.round(days/7)} weken.`:days===0?"Vandaag.":`Nog ${days} ${days===1?"dag":"dagen"}.`;
      const what=same.length===1?same[0].title:same.map(t=>t.title.split(" ")[0]).join(", ");
      card=`<div class="hero"><h3>Vóór ${esc(new Date(d+"T12:00:00").toLocaleDateString("nl-BE",{day:"numeric",month:"long"}))}</h3><p>${esc(what)}. ${left}</p>${same.length===1?`<button type="button" class="btn dark" data-act="edit" data-id="${esc(same[0].id)}">Bekijk</button>`:""}</div>`;
    }
  }
  if(!card){ const mn=new Date(cm+"-15T12:00:00").toLocaleDateString("nl-BE",{month:"long"}); card=`<div class="hero"><h3>${esc(mn.replace(/^./,c=>c.toUpperCase()))} in de tuin</h3><p>${esc(TIPS[cm.slice(5,7)])}</p></div>`; }
  h+=card;
  // maximaal 5 werken: eerst te laat, dan bezig, dan deze maand
  const late=open.filter(isLate).sort(byWhen);
  const busy=open.filter(t=>!isLate(t) && t.status==="bezig").sort(byWhen);
  const now=open.filter(t=>!isLate(t) && t.status!=="bezig" && inMonth(t,cm)).sort(byWhen);
  const list=[...late,...busy,...now];
  const top=list.slice(0,5), more=list.length-top.length;
  h+=`<section><div class="shead"><h2>Nu doen</h2></div>${rows(top, S.tasks.length?"Niets dringend. Geniet van de tuin.":"Nog geen werken. Tik op de plusknop om er een toe te voegen.")}
    <a class="seeall" href="#taken">${more>0?`Nog ${more} ${more===1?"werk":"werken"} deze maand · alle werken`:"Alle werken"}</a></section>`;
  return h;
}

/* ---------- planten ---------- */
const SOORTEN=[["boom","Boom"],["struik","Struik"],["klimplant","Klimplant"],["vaste","Vaste plant"],["bol","Bol of knol"],["eenjarige","Eenjarige"],["groente","Groente"],["kruid","Kruid"]];
const SOORT=Object.fromEntries(SOORTEN);
const SOORT_ICON={boom:"gazon",struik:"haag",klimplant:"haag",vaste:"bloemen",bol:"bloemen",eenjarige:"bloemen",groente:"moestuin",kruid:"moestuin"};
const PSTATUS=[["staat","Staat er"],["gepland","Gepland"],["weg","Weg"]];
const PST=Object.fromEntries(PSTATUS);
function plantRow(p){
  const z=Z[p.zone]||Z.algemeen;
  const sub=[SOORT[p.soort]||"Plant", SHORT[z.id]||z.name].map(esc).join(" · ");
  const n=(p.entries||[]).length;
  return `<li class="prow"><button class="tcard" type="button" data-act="plant" data-id="${esc(p.id)}">
    <span class="ticon" style="--z:${z.color};--zi:${z.ink}">${icon(SOORT_ICON[p.soort]||"bloemen")}</span>
    <span class="tmain"><span class="title">${esc(p.name)}</span><span class="sub">${sub}${n?` · ${n} ${n===1?"notitie":"notities"}`:""}</span></span>
    <span class="pst ${esc(p.status||"staat")}">${esc(PST[p.status||"staat"])}</span>
  </button></li>`;
}
function viewPlanten(){
  if(!S.loadedP) return loadingBlock();
  const q=(S.pq||"").toLowerCase(), f=S.pfilter||"alles", zf=S.pzone||"";
  let ps=S.plants.filter(p=>(!q||(p.name||"").toLowerCase().includes(q)) && (f==="alles"||(p.status||"staat")===f) && (!zf||p.zone===zf));
  ps.sort((a,b)=>(a.name||"").localeCompare(b.name||"","nl"));
  const cnt=k=>S.plants.filter(p=>(p.status||"staat")===k).length;
  let h=`<label class="search">${hand("zoek")}<input id="pq" type="search" placeholder="Zoek een plant" value="${esc(S.pq||"")}" aria-label="Zoek een plant"></label>
  <div class="filters">${[["alles","Alle "+S.plants.length],["staat","Staat er "+cnt("staat")],["gepland","Gepland "+cnt("gepland")],["weg","Weg "+cnt("weg")]].map(([k,l])=>`<button class="pill" type="button" data-act="pfilter" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}
  <select class="pill" id="pzone" aria-label="Filter op zone"><option value="">Alle zones</option>${ZONES.map(z=>`<option value="${z.id}" ${zf===z.id?"selected":""}>${esc(z.name)}</option>`).join("")}</select></div>`;
  h+= ps.length?`<ul class="tl plain">${ps.map(plantRow).join("")}</ul>`:`<div class="list"><div class="empty">${S.plants.length?"Geen planten met deze filter.":"Nog geen planten. Tik op de plusknop om je eerste plant toe te voegen."}</div></div>`;
  return h;
}
function plantDetail(id){
  const p=S.plants.find(x=>x.id===id); if(!p) return;
  const z=Z[p.zone]||Z.algemeen;
  const rowsDl=[["Soort",SOORT[p.soort]],["Zone",z.name],["Plek",p.spot],["Status",PST[p.status||"staat"]],["Geplant of gezaaid",p.planted?dateLong(p.planted):""],["Herkomst",p.origin],["Bloei",p.bloom],["Oogst",p.harvest],["Verzorging",p.care]].filter(r=>r[1]);
  const entries=[...(p.entries||[])].sort((a,b)=>(b.date||"")<(a.date||"")?-1:1);

/* plattegrond: coördinaten uit het grondplan in Figma (1 m = 24 px); alleen de tuin, geen gebouwen */
function mapSVG(){
  const counts={}; S.tasks.forEach(t=>{ if(t.status!=="klaar") counts[t.zone]=(counts[t.zone]||0)+1; });
  const sel=z=>S.zoneSel===z?"sel":"";
  const zone=(z,shape)=>shape.replace("<rect ",`<rect class="zone ${sel(z)}" data-act="zone" data-zone="${z}" tabindex="0" role="button" aria-label="${esc(Z[z].name)}" `).replace("<ellipse ",`<ellipse class="zone ${sel(z)}" data-act="zone" data-zone="${z}" tabindex="0" role="button" aria-label="${esc(Z[z].name)}" `).replace("<polygon ",`<polygon class="zone ${sel(z)}" data-act="zone" data-zone="${z}" tabindex="0" role="button" aria-label="${esc(Z[z].name)}" `);
  const W="#FFFFFF", WOUD="#212C02", OLIJF="#838E2C", LUCHT="#7BADC9", ROEST="#592A24", KLAP="#ED412F", ROOM="#FFF9EF";
  let s=`<svg viewBox="150 130 370 810" role="group" aria-label="Plattegrond van de tuin">
  <defs><clipPath id="perceel"><polygon points="160,140 508,140 508,750 429,750 429,973 218,973 218,928 160,928"/></clipPath></defs>
  <g clip-path="url(#perceel)">`;
  // gazon (rest van de tuin)
  s+=zone("gazon",`<polygon points="160,140 508,140 508,750 429,750 429,973 218,973 218,928 160,928" fill="${ROOM}" stroke="${WOUD}" stroke-width="1.5"/>`);
  // bomenzone links (kastanje + mispel), onder de rest
  s+=zone("bomen",`<ellipse cx="156" cy="779.5" rx="132" ry="159.5" fill="${WOUD}"/>`);
  // moestuin + bakken + pad
  s+=zone("moestuin",`<rect x="160" y="140" width="158" height="396" rx="3" fill="${OLIJF}"/>`);
  s+=`<g pointer-events="none"><rect x="227" y="237" width="24" height="299" fill="${ROEST}"/>`+[[176,344,37,67],[176,266,37,67],[265,344,37,39],[265,266,37,67],[265,463,37,37],[176,463,37,37],[265,420,37,37],[265,218,37,37],[176,420,37,37]].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${W}"/>`).join("")+`</g>`;
  s+=zone("compost",`<ellipse cx="186.5" cy="163.5" rx="21.5" ry="21.5" fill="${ROEST}"/>`);
  s+=zone("compost",`<ellipse cx="232" cy="164" rx="22" ry="22" fill="${ROEST}"/>`);
  // water + kippen
  s+=zone("water",`<rect x="318" y="140" width="53" height="50" rx="4" fill="${LUCHT}"/>`);
  s+=zone("kippen",`<rect x="371" y="140" width="137" height="178" rx="4" fill="${ROEST}"/>`);
  // bloemen + insectenhotel
  [[323,198,43,124],[323,322,89,72],[446,325,40,137],[364,750,60,211]].forEach(([x,y,w,h])=>{ s+=zone("bloemen",`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${KLAP}"/>`); });
  s+=`<rect x="322" y="317" width="24" height="12" fill="${WOUD}" pointer-events="none"/>`;
  // fruitstruikenhaag
  s+=zone("haag",`<rect x="486" y="327" width="20" height="415" rx="4" fill="${ROEST}"/>`);
  // stapstenen + buitendouche
  s+=`<g pointer-events="none">`+[[414,395],[421,375],[421,353],[421,331],[411,311],[244,566],[237,548],[232,529],[339,888],[356,888],[375,888],[395,888],[414,888]].map(([x,y])=>`<rect x="${x}" y="${y}" width="13" height="13" rx="3" fill="${W}" stroke="${WOUD}" stroke-width="1.2"/>`).join("")+`<rect x="177" y="907" width="24" height="24" rx="4" fill="${LUCHT}"/></g>`;
  // boomkronen (stippel) + stammen
  const crowns=[[322,555,108,WOUD],[269,403,30,ROOM],[405,464,48,WOUD],[220,218,48,ROOM]];
  s+=`<g pointer-events="none">`+crowns.map(([cx,cy,r,c])=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="6 5"/>`).join("");
  s+=[[400,632,17,WOUD],[269,403,14,ROEST],[405,464,14,ROEST],[220,218,14,ROEST],[245,825,14,ROEST],[195.5,671.5,10.5,ROEST]].map(([cx,cy,r,c])=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`).join("")+`</g>`;
  s+=`</g>`;
  // labels
  const L=(x,y,t,c,cls="")=>`<text class="lbl ${cls}" x="${x}" y="${y}" fill="${c}" text-anchor="middle">${t}</text>`;
  s+=L(239,525,"Moestuin",ROOM)+L(209,152,"compost",ROOM,"s")+L(344.5,170,"water",WOUD,"s")+L(439.5,232,"Kippenren",ROOM)+L(220,250,"moerbei",ROOM,"s")+L(269,441,"appel",WOUD,"s")+L(405,497,"pruim",WOUD,"s")+L(400,664,"notelaar",WOUD,"s")+L(210,705,"kastanje",ROOM,"s")+L(245,857,"mispel",ROOM,"s")+L(394,860,"bloemen",ROOM,"s")+L(330,800,"Gazon",WOUD)+L(189,950,"douche",WOUD,"s");
  // aantal open taken per zone
  const anchors={moestuin:[300,154],compost:[252,186],water:[362,184],kippen:[494,156],gazon:[470,560],bomen:[270,760],bloemen:[476,340],haag:[496,740]};
  Object.entries(anchors).forEach(([zid,[x,y]])=>{ if(counts[zid]) s+=`<g class="badge" pointer-events="none"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${y+4}">${counts[zid]}</text></g>`; });
  s+=`</svg>`;
  return s;
}
function viewKaart(){
  let h=`<div class="mapwrap"><div class="compass"><span>↑ noord (achteraan)</span><span>± op schaal</span></div>${mapSVG()}<div class="compass"><span>↓ huis</span><span>rood bolletje = open werken</span></div></div>`;
  h+=`<section><div class="zonelist">${ZONES.filter(z=>z.map).map(z=>`<button type="button" class="pill" data-act="zone" data-zone="${z.id}" aria-pressed="${S.zoneSel===z.id}">${esc(z.name)}</button>`).join("")}</div></section>`;
  if(S.zoneSel){
    const z=Z[S.zoneSel];
    const ts=S.tasks.filter(t=>t.zone===z.id);
    const open=ts.filter(t=>t.status!=="klaar").sort(byWhen), done=ts.filter(t=>t.status==="klaar");
    h+=listBlock(esc(z.name), open, "Geen open werken in deze zone.");

  } else {
    h+=`<p class="small" style="margin:0">Tik op een zone om de werken op die plek te zien.</p>`;
  }
  return h;

function viewTaken(){
  if(!S.loadedT) return loadingBlock();
  const cm=curMonth(), wm=S.wmonth||"", f=S.filter, zf=S.zoneFilter;
  const all=S.tasks, done=all.filter(t=>t.status==="klaar").length;
  let ts=all.filter(t=>(!zf||t.zone===zf));
  if(wm) ts=ts.filter(t=>inMonth(t,wm) || (t.status==="klaar" && f!=="open"));
  if(f==="open") ts=ts.filter(t=>t.status!=="klaar");
  else if(f==="klaar") ts=ts.filter(t=>t.status==="klaar");
  ts.sort(f==="klaar"?(a,b)=>(b.doneAt||"")<(a.doneAt||"")?-1:1:byWhen);
  const months=[0,1,2,3,4].map(i=>addMonths(cm,i));
  const openAll=all.filter(t=>t.status!=="klaar");
  let h=`<p class="small" style="margin:0">${done} van ${all.length} werken klaar</p>`;
  h+=`<div class="mstrip" role="group" aria-label="Kies een maand"><button type="button" class="mday ${!wm?"on":""}" data-act="wmonth" data-m="" aria-pressed="${!wm}"><span class="mname">alle</span><span class="mnum">${openAll.length}</span></button>${months.map(x=>{const n=openAll.filter(t=>inMonth(t,x)).length;return `<button type="button" class="mday ${x===wm?"on":""}" data-act="wmonth" data-m="${x}" aria-pressed="${x===wm}"><span class="mname">${mLabel(x)}</span><span class="mnum">${n}</span></button>`}).join("")}</div>`;
  h+=`<div class="filters">${[["open","Te doen"],["klaar","Klaar"]].map(([k,l])=>`<button class="pill" type="button" data-act="filter" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}<select class="pill" id="zoneFilter" aria-label="Filter op zone"><option value="">Alle zones</option>${ZONES.map(z=>`<option value="${z.id}" ${zf===z.id?"selected":""}>${esc(z.name)}</option>`).join("")}</select></div>`;
  h+=rows(ts, f==="klaar"?"Nog niets klaar.":"Niets te doen met deze keuze.");
  if(sb) h+=`<p class="small" style="margin:8px 0 0">Aangemeld als ${esc(S.me||"")} · <button type="button" class="linkbtn" data-act="logout">Afmelden</button></p>`;
  return h;
}
const TITLES={nu:"",kaart:"Tuin",taken:"Werken",planten:"Planten"};
function render(){
  $("#viewTitle").textContent=TITLES[S.view];

function taskDetail(id){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  const z=Z[t.zone]||Z.algemeen, bl=blockers(t);
  const waitsFor=(t.blockedBy||[]).map(i=>S.tasks.find(x=>x.id===i)).filter(Boolean);
  const unlocks=S.tasks.filter(x=>(x.blockedBy||[]).includes(t.id));
  const mats=(t.materials||"").split("\n").map(s=>s.trim()).filter(Boolean);
  let h=`<div class="bar-top"><h3>${esc(t.title)}</h3><button class="x" type="button" data-act="close" aria-label="Sluiten">${hand("kruis")}</button></div>`;
  if(!S.readOnly) h+=`<div class="seg" role="group" aria-label="Status">${[["open","Te doen"],["bezig","Bezig"],["klaar","Klaar"]].map(([k,l])=>`<button type="button" data-act="status" data-id="${esc(t.id)}" data-s="${k}" aria-pressed="${(t.status||"open")===k}">${l}</button>`).join("")}</div>`;
  h+=`<dl class="dl"><dt>Zone</dt><dd>${esc(z.name)}</dd>`;
  if(windowLabel(t)) h+=`<dt>Wanneer</dt><dd>${esc(windowLabel(t))}</dd>`;
  if(t.deadline) h+=`<dt>Vóór</dt><dd>${esc(dateLong(t.deadline))}${isLate(t)?" · te laat":""}</dd>`;
  if(t.who) h+=`<dt>Wie</dt><dd>${esc(who(t.who))}</dd>`;
  if(waitsFor.length) h+=`<dt>Wacht op</dt><dd>${waitsFor.map(b=>`<button type="button" class="linkbtn" data-act="open" data-id="${esc(b.id)}">${esc(b.title)}${b.status==="klaar"?" (klaar)":""}</button>`).join("<br>")}</dd>`;
  if(unlocks.length) h+=`<dt>Daarna</dt><dd>${unlocks.map(b=>`<button type="button" class="linkbtn" data-act="open" data-id="${esc(b.id)}">${esc(b.title)}</button>`).join("<br>")}</dd>`;
  if(t.status==="klaar"&&t.doneAt) h+=`<dt>Klaar op</dt><dd>${esc(dateLong(t.doneAt.slice(0,10)))}${t.doneBy?" · "+esc(who(t.doneBy)):""}</dd>`;
  h+=`</dl>`;
  if(t.notes) h+=`<section><h2>Waarom en hoe</h2><p style="margin:0;white-space:pre-wrap">${esc(t.notes)}</p></section>`;
  if(mats.length) h+=`<section><h2>Materiaal</h2><ul class="mats">${mats.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></section>`;
  if(!S.readOnly) h+=`<div class="btns"><button class="btn primary grow" type="button" data-act="edit" data-id="${esc(t.id)}">Aanpassen</button></div>`;
  openSheet(h);
}

    try{
      if(id){ if(newStatus!==(t.status||"open")){ data.status=newStatus; if(newStatus==="klaar"){data.doneAt=new Date().toISOString();data.doneBy=S.me;} else {data.doneAt=null;data.doneBy=null;} } await db.doc("tasks/"+id).update(data); closeSheet(); toast("Bewaard"); }
      else { data.status="open"; data.createdBy=S.me; data.createdAt=new Date().toISOString(); await db.collection("tasks").add(data); closeSheet(); toast("Taak toegevoegd"); }
    }catch(err){ btn.disabled=false; btn.textContent="Bewaren"; writeFailed(err); }
  });
}

function confirmSheet(text, yesLabel, onYes){
  openSheet(`<h3>${esc(text)}</h3><div class="btns"><button class="btn grow" type="button" data-act="close">Annuleren</button><button class="btn danger grow" type="button" id="yesBtn">${esc(yesLabel)}</button></div>`);
  $("#yesBtn").onclick=async()=>{ $("#yesBtn").disabled=true; try{ await onYes(); closeSheet(); }catch(e){ closeSheet(); writeFailed(e);} };
}

async function setStatus(id, status){
  const t=S.tasks.find(x=>x.id===id); if(!t || (t.status||"open")===status) return;
  const data={status};
  if(status==="klaar"){ data.doneAt=new Date().toISOString(); data.doneBy=S.me; } else { data.doneAt=null; data.doneBy=null; }
  try{
    await db.doc("tasks/"+id).update(data);
    if(status==="klaar") toast("Klaar: "+esc(t.title),[{label:"Ongedaan maken",run:()=>setStatus(id,t.status||"open")}]);
  }catch(e){ writeFailed(e); }
}


/* ---------- klikken ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="close") closeSheet();
  else if(a==="open") taskForm(id);
  else if(a==="toggle"){ if(S.readOnly||!db) return; const t=S.tasks.find(x=>x.id===id); setStatus(id, t.status==="klaar"?"open":"klaar"); }
  else if(a==="status"){ setStatus(id, el.dataset.s).then(()=>{ if(!$("#scrim").hidden) taskDetail(id); }); }
  else if(a==="edit"){ if(S.readOnly) return; taskForm(id); }
  else if(a==="deltask") confirmSheet("Deze taak verwijderen?","Verwijderen",()=>db.doc("tasks/"+id).delete());

  else if(a==="logout") logout();
  else if(a==="filter"){ S.filter=el.dataset.f; render(); }
  else if(a==="pfilter"){ S.pfilter=el.dataset.f; render(); }
  else if(a==="plant") plantDetail(id);
  else if(a==="editplant") plantForm(id);
  else if(a==="delplant") confirmSheet("Deze plant en zijn logboek verwijderen?","Verwijderen",()=>db.doc("plants/"+id).delete());
  else if(a==="month"){ S.month=el.dataset.m; render(); }
  else if(a==="wmonth"){ S.wmonth=el.dataset.m; render(); }
  else if(a==="who"){ S.whoFilter=el.dataset.who; S.filter="open"; if(S.view!=="taken") location.hash="taken"; else render(); }
  else if(a==="zonefilter"){ S.zoneFilter=el.dataset.zone; S.filter="open"; location.hash="taken"; }
  else if(a==="deadline"){ S.zoneFilter=""; S.wmonth=""; S.filter="open"; location.hash="taken"; }
  else if(a==="zone"){ S.zoneSel = S.zoneSel===el.dataset.zone?null:el.dataset.zone; render(); }
});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("svg .zone")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }});
$("#fab").onclick=()=>{ if(S.view==="planten") plantForm(); else taskForm(); };

const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprZnBycXVjaW92ZWtjYnhicWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODUwOTUsImV4cCI6MjExMDA2MTA5NX0.bfBp_8wqKpQ7rroZKzG_VuIicbiuJ9pUOJsbRBDr8s8"; // publieke sleutel, beveiliging zit in de database
let sb=null;
function makeDb(){
  const subs={tasks:[],plants:[]}, cache={tasks:[],plants:[]};
  const emit=t=>{ const snap={docs:cache[t].map(r=>({id:r.id,data:()=>r.data})),metadata:{fromCache:false,hasPendingWrites:false}}; subs[t].forEach(s=>s.next(snap)); };
  async function load(t){ const {data,error}=await sb.from(t).select("id,data"); if(error) throw error; cache[t]=data||[]; emit(t); }
  const refresh=t=>load(t).catch(e=>subs[t].forEach(s=>s.err&&s.err(e)));
  sb.channel("tuin")
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},()=>refresh("tasks"))
    .on("postgres_changes",{event:"*",schema:"public",table:"plants"},()=>refresh("plants"))
    .subscribe();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ refresh("tasks"); refresh("plants"); } });
  const fail=(t,e)=>{ refresh(t); throw e; };
  return {
    collection:t=>({
      onSnapshot:(next,err)=>{ subs[t].push({next,err}); refresh(t); return ()=>{}; },
      add:async data=>{ const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
        cache[t]=[...cache[t],{id,data}]; emit(t);
        const {error}=await sb.from(t).insert({id,data}); if(error) fail(t,error); return {id}; }
    }),
    doc:path=>{ const [t,id]=path.split("/"); return {
      update:async patch=>{ const row=cache[t].find(r=>r.id===id); const merged=Object.assign({},row?row.data:{},patch);
        cache[t]=cache[t].map(r=>r.id===id?{id,data:merged}:r); emit(t);
        const {error}=await sb.from(t).update({data:merged,updated_at:new Date().toISOString()}).eq("id",id); if(error) fail(t,error); },
      delete:async()=>{ cache[t]=cache[t].filter(r=>r.id!==id); emit(t);
        const {error}=await sb.from(t).delete().eq("id",id); if(error) fail(t,error); },
      set:async data=>{ const {error}=await sb.from(t).upsert({id,data}); if(error) fail(t,error); refresh(t); }
    }; }
  };
}

/* ---------- aanmelden met mailadres en wachtwoord ---------- */
S.authed=false;
function loginHTML(){
  return `<section class="login"><h2>Aanmelden</h2>
    <p class="small" style="margin:0">Meld je één keer aan. Daarna blijf je aangemeld op deze gsm.</p>
    <form id="loginForm" class="loginform">
      <label class="f">Mailadres<input id="l-mail" type="email" required autocomplete="username" inputmode="email"></label>
      <label class="f">Wachtwoord<input id="l-pass" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Aanmelden</button>
    </form>
    <p class="small" style="margin:0">Wachtwoord vergeten? Noa kan het opnieuw instellen in Supabase.</p>
  </section>`;
}
function bindLogin(){
  const f=$("#loginForm"); if(!f) return;
  f.addEventListener("submit",async e=>{ e.preventDefault();
    const email=$("#l-mail").value.trim().toLowerCase(), password=$("#l-pass").value;
    const b=f.querySelector("button"); b.disabled=true; b.textContent="Bezig…";
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){ b.disabled=false; b.textContent="Aanmelden"; setNote("Aanmelden lukte niet. Kijk je mailadres en wachtwoord na."); return; }
    setNote(""); start(data.session); });
}
async function logout(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }

async function start(session){
  S.authed=true; S.me=(session.user.email||"").toLowerCase();
  const {data:mem}=await sb.from("members").select("email,name");
  (mem||[]).forEach(m=>S.names[m.email.toLowerCase()]=m.name);
  S.members=(mem||[]).map(m=>m.email.toLowerCase());
  if(!S.members.includes(S.me)){ setNote("Dit mailadres ("+S.me+") heeft geen toegang tot de tuin. Meld je aan met een ander adres."); S.loadedT=S.loadedP=true; S.readOnly=true; render(); return; }
  db=makeDb();
  db.collection("tasks").onSnapshot(snap=>{ S.tasks=snap.docs.map(d=>Object.assign({id:d.id},d.data())); S.loadedT=true; render(); },
    err=>{ S.loadedT=true; setNote("Taken laden lukte niet. Controleer je verbinding."); render(); });
  db.collection("plants").onSnapshot(snap=>{ S.plants=snap.docs.map(d=>Object.assign({id:d.id},d.data())); S.loadedP=true; render(); },
    err=>{ S.loadedP=true; render(); });
  render();
}

/* ---------- opstarten ---------- */
document.querySelectorAll(".ni").forEach(el=>el.innerHTML=hand(el.dataset.i));
(async function init(){
  if(!window.supabase || SB_URL.startsWith("__")){ setNote("De app is nog niet gekoppeld aan de database."); S.authed=true; S.loadedT=S.loadedP=true; route(); return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data}=await sb.auth.getSession();
  route();
  if(data && data.session) start(data.session); else render();
})();
